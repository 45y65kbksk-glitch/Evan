<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#1a1320" />
  <title>Бар-крол по Китай-городу</title>
  <meta name="description" content="Путеводитель-игра по барам Китай-города для тёплой компании." />

  <!-- Leaflet (карта на бесплатном OpenStreetMap) -->
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
</head>
<body>
  <header class="topbar">
    <div class="topbar__title">
      <span class="topbar__emoji">🍻</span>
      <div>
        <h1>Бар-крол</h1>
        <p>Китай-город · для своих</p>
      </div>
    </div>
    <div class="progress" id="progress" title="Сколько баров пройдено">
      <span class="progress__count" id="progressCount">0/0</span>
      <div class="progress__bar"><div class="progress__fill" id="progressFill"></div></div>
    </div>
  </header>

  <nav class="tabs">
    <button class="tab tab--active" data-view="list">📋 Маршрут</button>
    <button class="tab" data-view="map">🗺️ Карта</button>
    <button class="tab" data-view="passport">🎫 Паспорт</button>
  </nav>

  <main>
    <!-- СПИСОК / МАРШРУТ -->
    <section id="view-list" class="view view--active">
      <div id="barList" class="bar-list"></div>
    </section>

    <!-- КАРТА -->
    <section id="view-map" class="view">
      <div id="map"></div>
    </section>

    <!-- ПАСПОРТ -->
    <section id="view-passport" class="view">
      <div class="passport">
        <div class="passport__ring">
          <span class="passport__big" id="passportBig">0</span>
          <span class="passport__total" id="passportTotal">из 0</span>
        </div>
        <p class="passport__caption" id="passportCaption"></p>
        <div id="passportBadges" class="badges"></div>
        <button id="resetBtn" class="btn btn--ghost">Сбросить прогресс</button>
      </div>
    </section>
  </main>

  <!-- Модалка карточки бара -->
  <div id="modal" class="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card" role="dialog" aria-modal="true">
      <button class="modal__close" data-close aria-label="Закрыть">✕</button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
