<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#070709" />
  <title>Бар-крол · Китай-город</title>
  <meta name="description" content="Путеводитель по барам Китай-города. Для своих." />

  <link rel="stylesheet" href="css/styles.css" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icons/icon.svg" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
</head>
<body>
  <!-- ───────── ДОМАШНИЙ / СТАРТОВЫЙ ЭКРАН ───────── -->
  <section id="start" class="start">
    <div class="start__aurora"></div>
    <div class="start__card glass">
      <span class="start__kicker">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-8 8-8-8Z"/><path d="M12 13v6"/><path d="M8 19h8"/></svg>
        </span>
        Китай-город
      </span>
      <h1 class="start__title">С возвращением!</h1>
      <p class="start__sub">Продолжим вечер по барам Китай-города?</p>
      <button id="startBtn" class="btn btn--primary btn--lg start__btn">
        Начать
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </section>

  <!-- ───────── ПРИЛОЖЕНИЕ ───────── -->
  <div id="app" class="app" hidden>
    <header class="topbar glass">
      <div class="topbar__title">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16l-8 8-8-8Z"/><path d="M12 13v6"/><path d="M8 19h8"/></svg>
        </span>
        <div>
          <h1>Бар-крол</h1>
          <p>Китай-город · для своих</p>
        </div>
      </div>
      <div class="topbar__progress" id="progress" title="Сколько баров отмечено">
        <span class="topbar__count" id="progressCount">0/0</span>
        <div class="topbar__track"><div class="topbar__fill" id="progressFill"></div></div>
      </div>
    </header>

    <nav class="tabs glass">
      <button class="tab tab--active" data-view="map">
        <span class="tab__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4 3.5 6v13.5L9 17.5l6 2 5.5-2V3.5L15 5.5 9 3.5Z"/><path d="M9 4v13.5M15 5.5V19"/></svg></span>
        <span class="tab__lbl">Карта</span>
      </button>
      <button class="tab" data-view="route">
        <span class="tab__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="6" r="2"/><circle cx="18" cy="18" r="2"/><path d="M8 6h5a4 4 0 0 1 0 8h-3a4 4 0 0 0 0 4h6"/></svg></span>
        <span class="tab__lbl">Маршрут</span>
      </button>
      <button class="tab" data-view="ratings">
        <span class="tab__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5l2.55 5.17 5.7.83-4.12 4.02.97 5.68L12 16.9l-5.1 2.3.97-5.68L3.75 9.5l5.7-.83L12 3.5Z"/></svg></span>
        <span class="tab__lbl">Оценки</span>
      </button>
      <button class="tab" data-view="passport">
        <span class="tab__ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5.5" width="17" height="13" rx="2.5"/><circle cx="9" cy="11" r="1.8"/><path d="M6.2 15.6c.5-1.2 1.5-1.9 2.8-1.9s2.3.7 2.8 1.9"/><path d="M14.5 10.5h3.5M14.5 13.5h3.5"/></svg></span>
        <span class="tab__lbl">Паспорт</span>
      </button>
    </nav>

    <main>
      <!-- КАРТА -->
      <section id="view-map" class="view view--active">
        <div class="map-wrap">
          <div id="map"></div>
          <div id="mapOverlay" class="map-overlay" hidden></div>
          <div class="map-zoom">
            <button id="zoomIn" class="map-zoom__btn glass" aria-label="Приблизить">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
            </button>
            <button id="zoomOut" class="map-zoom__btn glass" aria-label="Отдалить">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 12h14"/></svg>
            </button>
          </div>
        </div>
      </section>

      <!-- МАРШРУТ + ТАЙМЕР -->
      <section id="view-route" class="view">
        <div id="timerPanel" class="timer glass" hidden></div>

        <div class="route-block">
          <div class="section-head">
            <h2>Твой маршрут</h2>
            <span class="section-head__hint" id="routeHint"></span>
          </div>
          <div id="routeList" class="route-list"></div>
        </div>

        <div class="route-block">
          <div class="section-head"><h2>Добавить бар</h2></div>
          <div id="routeAdd" class="route-add"></div>
        </div>
      </section>

      <!-- МОИ ОЦЕНКИ -->
      <section id="view-ratings" class="view">
        <div class="section-head">
          <h2>Мои оценки</h2>
          <span class="section-head__hint" id="ratingsAvg"></span>
        </div>
        <div id="ratingsList" class="bar-list"></div>
      </section>

      <!-- ПАСПОРТ -->
      <section id="view-passport" class="view">
        <div class="passport glass">
          <div class="passport__ring">
            <span class="passport__big" id="passportBig">0</span>
            <span class="passport__total" id="passportTotal">из 0</span>
          </div>
          <div class="passport__rank" id="passportRank">—</div>
          <p class="passport__caption" id="passportCaption"></p>
          <div class="passport__meter">
            <span>Рейтинг</span>
            <div class="passport__stars" id="passportStars"></div>
          </div>
          <div id="passportBadges" class="badges"></div>
          <button id="resetBtn" class="btn btn--ghost">Сбросить прогресс</button>
        </div>
      </section>
    </main>
  </div>

  <!-- ───────── КАРТОЧКА БАРА (нижний лист) ───────── -->
  <div id="modal" class="modal" hidden>
    <div class="modal__backdrop" data-close></div>
    <div class="modal__card glass" role="dialog" aria-modal="true">
      <div class="modal__grip" data-close></div>
      <button class="modal__close" data-close aria-label="Закрыть">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
